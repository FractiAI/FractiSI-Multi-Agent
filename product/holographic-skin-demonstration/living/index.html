<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Enrichment Menu · Holographic Skin · FractiSI</title>
  <meta name="description" content="Enrichment Menu — top Soft Story game menu. Every daily aspect stays inside the holographic skin you chose." />
  <link rel="canonical" href="https://fractisi.vercel.app/product/holographic-skin-demonstration/living/" />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Oswald:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/product/holographic-skin-demonstration/assets/holographic-living.css" />
</head>
<body class="hl-page hl-game hl-cabin">
  <div class="hl-game__bg" id="hl-game-bg" aria-hidden="true" style="background-image:url('/product/holographic-skin-demonstration/media/hl-cabin-interior.jpg')"></div>
  <div class="hl-game__veil" aria-hidden="true"></div>

  <nav class="hl-game__nav" aria-label="FractiSI">
    <a class="hl-game__mark" href="/">FractiSI</a>
    <a href="/product/holographic-skin-demonstration/">Welcome</a>
    <a href="/product/holographic-skin-demonstration/auto-session/">Auto Session</a>
    <a href="/product/holographic-skin-demonstration/create/">Create</a>
  </nav>

  <main class="hl-game__shell">
    <header class="hl-game__title">
      <p class="hl-game__kicker">Holographic Skin</p>
      <h1>Enrichment</h1>
      <p class="hl-game__tag">The whole board is Enrichment. Choose a scene. Stay inside the story.</p>
    </header>

    <nav class="hl-menu" id="hl-menu" role="list" aria-label="Enrichment Menu"></nav>

    <footer class="hl-game__foot">
      <a class="hl-game__cta hl-game__cta--ghost" href="/product/holographic-skin-demonstration/create/">Create yours</a>
      <p class="honesty">1800s frontier watercolor Soft Story · likeness art, not raw photos · demo only.</p>
    </footer>
  </main>

  <div class="hl-panel" id="hl-panel" role="dialog" aria-modal="true" aria-labelledby="hl-panel-title" hidden>
    <div class="hl-panel__sheet">
      <div class="hl-panel__head">
        <h2 id="hl-panel-title">Sirens</h2>
        <button type="button" class="hl-panel__close" id="hl-panel-close">← Menu</button>
      </div>
      <div id="hl-panel-body"></div>
    </div>
  </div>

  <div class="hl-stage" id="hl-stage" hidden>
    <img class="hl-stage__img" id="hl-stage-img" alt="" />
    <div class="hl-stage__veil" aria-hidden="true"></div>
    <button type="button" class="hl-stage__close" id="hl-stage-close">← Menu</button>
    <div class="hl-stage__caption">
      <h2 id="hl-stage-title"></h2>
      <p id="hl-stage-blurb"></p>
    </div>
    <button type="button" class="hl-stage__return" id="hl-stage-return">Return to menu</button>
  </div>

  <script>
(function () {
  const MEDIA = '/product/holographic-skin-demonstration/media/';
  const CHANNEL = 'hl-auto-session';
  const params = new URLSearchParams(location.search);
  const autoMode = params.get('auto') === '1';
  const companionPort = Number(params.get('companion') || 18765);
  const companionBase = 'http://127.0.0.1:' + companionPort;
  const bootSceneId = params.get('scene') || '';
  const bootStage = params.get('stage') === '1';
  const bootSiren = params.get('siren') || '';

  const scenes = {
    'clark-kent': { id: 'clark-kent', label: 'Clark Kent', blurb: 'Ordinary day', image: MEDIA + 'hl-clark-kent.jpg' },
    superhero: { id: 'superhero', label: 'Superhero', blurb: 'Captain of SS Vibelandia', image: MEDIA + 'hl-superhero.jpg' },
    vibelandia: { id: 'vibelandia', label: 'SS Vibelandia', blurb: 'Goldilocks cruiseship', image: MEDIA + 'hl-vibelandia.jpg' },
    'bat-cave': { id: 'bat-cave', label: 'Bat cave', blurb: 'Work-cave', image: MEDIA + 'hl-bat-cave.jpg' },
    'frontier-work': { id: 'frontier-work', label: 'Frontier work', blurb: 'Labor at the edge', image: MEDIA + 'hl-frontier-work.jpg' },
    'duck-hunting': { id: 'duck-hunting', label: 'Duck hunting', blurb: 'Hunt for deliveries', image: MEDIA + 'hl-duck-hunting.jpg' },
    'big-game-fishing': { id: 'big-game-fishing', label: 'Big game fishing', blurb: 'Tropical marlin · hunt for a sponsor', image: MEDIA + 'hl-big-game-fishing.jpg' },
    'bottom-fishing': { id: 'bottom-fishing', label: 'Bottom fishing', blurb: 'Lines in deep water', image: MEDIA + 'hl-bottom-fishing.jpg' },
    'whatsapp-root-lab': {
      id: 'whatsapp-root-lab',
      label: 'Root Lab',
      blurb: 'Root talk on the channel',
      image: MEDIA + 'hl-whatsapp-root-lab.jpg',
    },
    'wiring-wet-lab': { id: 'wiring-wet-lab', label: 'Wiring lab', blurb: 'Wires between people', image: MEDIA + 'hl-wiring-wet-lab.jpg' },
    'el-cortez-lab': { id: 'el-cortez-lab', label: 'El Cortez Lab', blurb: 'Compute in town', image: MEDIA + 'hl-el-cortez-lab.jpg' },
    'mens-restroom-theater': {
      id: 'mens-restroom-theater',
      label: 'Restroom theater',
      blurb: 'Behavior theater',
      image: MEDIA + 'hl-mens-restroom-theater.jpg',
    },
    'eating-drinking': { id: 'eating-drinking', label: 'Table', blurb: 'Food and drink', image: MEDIA + 'hl-eating-drinking.jpg' },
    resting: { id: 'resting', label: 'Resting', blurb: 'Quiet between hunts', image: MEDIA + 'hl-resting.jpg' },
    sleeping: { id: 'sleeping', label: 'Sleeping', blurb: 'Night rest', image: MEDIA + 'hl-sleeping.jpg' },
    bathroom: { id: 'bathroom', label: 'Bathroom', blurb: 'Wash and water', image: MEDIA + 'hl-bathroom.jpg' },
    errands: { id: 'errands', label: 'Errands', blurb: 'Town errands', image: MEDIA + 'hl-errands.jpg' },
  };

  const sirens = [
    { id: 'dorila', label: 'Dorila', image: MEDIA + 'hl-siren-dorila.jpg' },
    { id: 'valeria', label: 'Valeria', image: MEDIA + 'hl-siren-valeria.jpg' },
    { id: 'viviana', label: 'Viviana', image: MEDIA + 'hl-siren-viviana.jpg' },
    { id: 'yeris', label: 'Yeris', image: MEDIA + 'hl-siren-yeris.jpg' },
    { id: 'erika', label: 'Erika', image: MEDIA + 'hl-siren-erika.jpg' },
    { id: 'winni', label: 'Winni', image: MEDIA + 'hl-siren-winni.jpg' },
    { id: 'fanfan', label: 'Fanfan', image: MEDIA + 'hl-siren-fanfan.jpg' },
    { id: 'monica', label: 'Monica', image: MEDIA + 'hl-siren-monica.jpg' },
    { id: 'sarah', label: 'Sarah', image: MEDIA + 'hl-siren-sarah.jpg' },
    { id: 'yaqui', label: 'Yaqui', image: MEDIA + 'hl-siren-yaqui.jpg' },
  ];

  const topLevel = [
    'clark-kent',
    'superhero',
    'vibelandia',
    'bat-cave',
    'frontier-work',
    'duck-hunting',
    'big-game-fishing',
    'bottom-fishing',
    'whatsapp-root-lab',
    'wiring-wet-lab',
    'el-cortez-lab',
    'mens-restroom-theater',
    'sirens',
    'eating-drinking',
    'resting',
    'sleeping',
    'bathroom',
    'errands',
  ];

  const menuEl = document.getElementById('hl-menu');
  const panel = document.getElementById('hl-panel');
  const panelTitle = document.getElementById('hl-panel-title');
  const panelBody = document.getElementById('hl-panel-body');
  const panelClose = document.getElementById('hl-panel-close');
  const stage = document.getElementById('hl-stage');
  const stageImg = document.getElementById('hl-stage-img');
  const stageTitle = document.getElementById('hl-stage-title');
  const stageBlurb = document.getElementById('hl-stage-blurb');
  const stageClose = document.getElementById('hl-stage-close');
  const stageReturn = document.getElementById('hl-stage-return');
  const gameBg = document.getElementById('hl-game-bg');
  const defaultBg = MEDIA + 'hl-cabin-interior.jpg';
  const bc = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel(CHANNEL) : null;
  let lastAutoSceneId = '';
  let suppressMenuBroadcast = false;

  function setGameBg(url) {
    if (gameBg && url) gameBg.style.backgroundImage = 'url("' + url + '")';
  }

  function loadPeopleSkins() {
    try {
      var raw = localStorage.getItem('hl-soft-story-people-v1');
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function resolveScene(id, imageOverride) {
    if (imageOverride) {
      var base = scenes[id] || {};
      var peopleHit = loadPeopleSkins().find(function (x) { return x.id === id; });
      return {
        id: id,
        label: (peopleHit && peopleHit.label) || base.label || id,
        blurb: (peopleHit && peopleHit.blurb) || base.blurb || 'Person Soft Story',
        image: imageOverride,
      };
    }
    if (scenes[id]) return scenes[id];
    const s = sirens.find(function (x) { return x.id === id; });
    if (s) return { id: s.id, label: s.label, blurb: 'Mermaid Soft Story', image: s.image };
    var person = loadPeopleSkins().find(function (x) { return x.id === id; });
    if (person && person.image) {
      return {
        id: person.id,
        label: person.label || person.id,
        blurb: person.blurb || 'Person Soft Story',
        image: person.image,
      };
    }
    return null;
  }

  function notifyMenuSelection(scene) {
    if (suppressMenuBroadcast || !scene) return;
    var payload = {
      type: 'menu-selection',
      sceneId: scene.id || '',
      label: scene.label || '',
      image: scene.image || '',
      ts: Date.now(),
    };
    try {
      bc && bc.postMessage(payload);
    } catch (e) { /* ignore */ }
    if (autoMode) {
      fetch(companionBase + '/menu', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sceneId: payload.sceneId, label: payload.label }),
      }).catch(function () {});
    }
  }

  function openStage(scene, opts) {
    if (!scene || !scene.image) return;
    opts = opts || {};
    stageImg.src = scene.image;
    stageImg.alt = scene.label || '';
    stageTitle.textContent = scene.label || '';
    stageBlurb.textContent = scene.blurb || '';
    stage.hidden = false;
    stage.classList.add('is-open');
    document.body.classList.add('hl-lock');
    if (!opts.quietFocus) stageClose.focus();
    if (!opts.fromAuto) notifyMenuSelection(scene);
  }

  function closeStage() {
    stage.classList.remove('is-open');
    stage.hidden = true;
    stageImg.removeAttribute('src');
    if (!panel.classList.contains('is-open')) document.body.classList.remove('hl-lock');
  }

  function openSirens() {
    panelTitle.textContent = 'Sirens';
    panelBody.innerHTML = '';
    const ul = document.createElement('ul');
    ul.className = 'hl-panel__list';
    sirens.forEach((s) => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = s.label;
      b.addEventListener('click', () =>
        openStage({ id: s.id, label: s.label, blurb: 'Mermaid Soft Story', image: s.image }),
      );
      li.appendChild(b);
      ul.appendChild(li);
    });
    panelBody.appendChild(ul);
    panel.hidden = false;
    panel.classList.add('is-open');
    document.body.classList.add('hl-lock');
    panelClose.focus();
  }

  function closePanel() {
    panel.classList.remove('is-open');
    panel.hidden = true;
    panelBody.innerHTML = '';
    if (!stage.classList.contains('is-open')) document.body.classList.remove('hl-lock');
  }

  function applyAutoScene(sceneId, imageOverride) {
    if (!sceneId) return;
    var scene = resolveScene(sceneId, imageOverride || null);
    if (!scene) return;
    var key = sceneId + '|' + (scene.image || '');
    if (key === lastAutoSceneId) return;
    lastAutoSceneId = key;
    suppressMenuBroadcast = true;
    closePanel();
    openStage(scene, { fromAuto: true, quietFocus: true });
    suppressMenuBroadcast = false;
  }

  topLevel.forEach((id, index) => {
    const isSirens = id === 'sirens';
    const scene = scenes[id];
    const label = isSirens ? 'Sirens' : scene.label;
    const thumb = isSirens ? MEDIA + 'hl-siren-dorila.jpg' : scene.image;
    const blurb = isSirens ? 'Ten mermaids' : scene.blurb;

    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'hl-menu__btn';
    b.setAttribute('role', 'listitem');
    b.style.setProperty('--hl-thumb', 'url("' + thumb + '")');

    b.innerHTML =
      '<span class="hl-menu__idx">' +
      String(index + 1).padStart(2, '0') +
      '</span><span class="hl-menu__copy"><span class="hl-menu__label">' +
      label +
      '</span><small>' +
      blurb +
      '</small></span><span class="hl-menu__go" aria-hidden="true">›</span>';

    b.addEventListener('mouseenter', () => setGameBg(thumb));
    b.addEventListener('focus', () => setGameBg(thumb));
    b.addEventListener('mouseleave', () => {
      if (document.activeElement !== b) setGameBg(defaultBg);
    });
    b.addEventListener('blur', () => setGameBg(defaultBg));
    b.addEventListener('click', () => {
      if (isSirens) openSirens();
      else openStage(scene);
    });
    menuEl.appendChild(b);
  });

  panelClose.addEventListener('click', closePanel);
  stageClose.addEventListener('click', closeStage);
  stageReturn.addEventListener('click', closeStage);
  panel.addEventListener('click', (e) => {
    if (e.target === panel) closePanel();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (stage.classList.contains('is-open')) closeStage();
    else if (panel.classList.contains('is-open')) closePanel();
  });

  if (bc) {
    bc.addEventListener('message', function (ev) {
      var msg = ev.data;
      if (!msg) return;
      if (msg.type === 'select-scene' && msg.sceneId) applyAutoScene(msg.sceneId, msg.image || null);
    });
  }

  if (autoMode) {
    setInterval(function () {
      fetch(companionBase + '/state', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (state) {
          if (state && state.sceneId) applyAutoScene(state.sceneId, state.image || null);
        })
        .catch(function () {});
    }, 1600);
  }

  if (bootSiren) {
    var siren = resolveScene(bootSiren);
    if (siren) openStage(siren, { fromAuto: true });
  } else if (bootSceneId) {
    var boot = resolveScene(bootSceneId);
    if (boot && bootStage) openStage(boot, { fromAuto: autoMode, quietFocus: autoMode });
    else if (boot) setGameBg(boot.image);
  }
})();
  </script>
</body>
</html>
