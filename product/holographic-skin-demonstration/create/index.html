<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Create · Holographic Skin · FractiSI</title>
  <meta name="description" content="Create your Enrichment Menu — name the skin, list the scenes, play." />
  <link rel="canonical" href="https://fractisi.vercel.app/product/holographic-skin-demonstration/create/" />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Oswald:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/product/holographic-skin-demonstration/assets/holographic-living.css" />
  <link rel="stylesheet" href="/product/holographic-skin-demonstration/assets/holographic-skin-create.css" />
</head>
<body class="hl-page hl-game hl-cabin">
  <div class="hl-game__bg" aria-hidden="true" style="background-image:url('/product/holographic-skin-demonstration/media/hl-frontier-work.jpg')"></div>
  <div class="hl-game__veil" aria-hidden="true"></div>

  <nav class="hl-game__nav" aria-label="FractiSI">
    <a class="hl-game__mark" href="/">FractiSI</a>
    <a href="/product/holographic-skin-demonstration/">Title</a>
    <a href="/product/holographic-skin-demonstration/living/">Play</a>
  </nav>

  <main class="hl-game__shell hl-create-shell">
    <header class="hl-game__title">
      <p class="hl-game__kicker">Holographic Skin</p>
      <h1>Create</h1>
      <p class="hl-game__tag">Make your own Enrichment Menu. Give it a name. List the scenes. Play.</p>
    </header>

    <form id="hl-create-form" class="hl-create-form hl-create-form--cabin" aria-label="Create Enrichment Menu">
      <label>
        Skin title
        <input id="skin-title" name="title" type="text" maxlength="80" required placeholder="My Enrichment" autocomplete="off" />
      </label>
      <label>
        Vibe
        <textarea id="vibes" name="vibes" rows="2" maxlength="400" required placeholder="Quiet frontier · brass lantern · daily life inside the story"></textarea>
      </label>
      <label>
        Menu scenes <span class="hl-hint-inline">(comma-separated)</span>
        <textarea id="elements" name="elements" rows="3" maxlength="800" required placeholder="Clark Kent, Superhero, Bat cave, Root Lab, Table, Resting"></textarea>
      </label>
      <input type="hidden" name="styles" value="frontier-dusk" />
      <div class="hl-title__actions">
        <button type="submit" class="hl-game__cta" id="hl-generate">Generate menu</button>
        <a class="hl-game__cta hl-game__cta--ghost" href="/product/holographic-skin-demonstration/living/">His menu</a>
      </div>
    </form>

    <section id="hl-skin-result" class="hl-skin-result hl-skin-result--cabin" hidden aria-live="polite">
      <header class="hl-game__title">
        <p class="hl-game__kicker">Your Enrichment Menu</p>
        <h2 id="result-title"></h2>
        <p id="result-vibe" class="hl-game__tag"></p>
      </header>
      <nav class="hl-menu" id="result-menu" role="list"></nav>
      <div class="hl-title__actions">
        <button type="button" class="hl-game__cta hl-game__cta--ghost" id="hl-download-json">Download JSON</button>
        <button type="button" class="hl-game__cta hl-game__cta--ghost" id="hl-reset">Compose another</button>
      </div>
    </section>

    <p class="honesty">Client Soft Story generator · procedural panels · not a hosted image bake-off.</p>
  </main>

  <div class="hl-stage" id="hl-stage" hidden>
    <canvas class="hl-stage__canvas" id="hl-stage-canvas" width="1280" height="720" aria-hidden="true"></canvas>
    <div class="hl-stage__veil" aria-hidden="true"></div>
    <button type="button" class="hl-stage__close" id="hl-stage-close">← Menu</button>
    <div class="hl-stage__caption">
      <h2 id="hl-stage-title"></h2>
      <p id="hl-stage-blurb"></p>
    </div>
    <button type="button" class="hl-stage__return" id="hl-stage-return">Return to menu</button>
  </div>

  <script src="/product/holographic-skin-demonstration/assets/holographic-skin-create.js"></script>
</body>
</html>
