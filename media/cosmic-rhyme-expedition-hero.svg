<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-label="Relational map of cosmic observations">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="55%" stop-color="#1a2740"/>
      <stop offset="100%" stop-color="#2c3a28"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="640" fill="url(#sky)"/>
  <g stroke="#c4b483" stroke-width="1.2" opacity="0.55">
    <line x1="180" y1="420" x2="410" y2="210"/>
    <line x1="410" y1="210" x2="640" y2="300"/>
    <line x1="640" y1="300" x2="880" y2="160"/>
    <line x1="880" y1="160" x2="1120" y2="280"/>
    <line x1="640" y1="300" x2="920" y2="460"/>
    <line x1="920" y1="460" x2="1280" y2="380"/>
    <line x1="410" y1="210" x2="520" y2="480"/>
  </g>
  <g fill="#f2e6c8">
    <circle cx="180" cy="420" r="5"/><circle cx="410" cy="210" r="7"/>
    <circle cx="640" cy="300" r="6"/><circle cx="880" cy="160" r="8"/>
    <circle cx="1120" cy="280" r="5"/><circle cx="920" cy="460" r="6"/>
    <circle cx="1280" cy="380" r="7"/><circle cx="520" cy="480" r="4"/>
    <circle cx="300" cy="120" r="2" opacity="0.7"/><circle cx="760" cy="520" r="2" opacity="0.7"/>
    <circle cx="1400" cy="140" r="2.5" opacity="0.8"/><circle cx="100" cy="200" r="2" opacity="0.6"/>
  </g>
  <text x="80" y="580" fill="#d7c79a" font-family="Georgia, serif" font-size="28" opacity="0.9">observations → relationships → ?</text>
</svg>
