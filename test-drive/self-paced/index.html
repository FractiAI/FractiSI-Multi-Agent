<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Self-paced Test Drive · FractiSI Multi-Agent</title>
  <meta name="description" content="Self-paced FractiSI Multi-Agent Test Drive — plain primer, then live labs with Run, Previous, and Next.">
  <link rel="stylesheet" href="/css/site.css?v=31">
  <style>
    .walk {
      max-width: 40rem;
      margin: 1.75rem auto 3rem;
      padding: 0 1.25rem;
    }
    .walk .progress {
      font-family: var(--sans);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 0.55rem;
      font-weight: 650;
    }
    .walk h1 {
      margin: 0 0 0.45rem;
      font-size: clamp(1.55rem, 3.5vw, 2rem);
      font-weight: 500;
      line-height: 1.25;
    }
    .walk .component {
      font-family: var(--sans);
      font-size: 0.92rem;
      color: var(--muted);
      margin: 0 0 1.1rem;
    }
    .walk .body p {
      margin: 0 0 0.85rem;
      color: var(--ink);
      font-size: 1.08rem;
    }
    .walk .body .label {
      font-family: var(--sans);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 650;
      margin: 1rem 0 0.3rem;
    }
    .walk .body ul {
      margin: 0.35rem 0 1rem;
      padding-left: 1.15rem;
    }
    .walk .body li {
      margin: 0.45rem 0;
      color: var(--ink);
      font-size: 1.02rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      margin: 1.25rem 0 0.75rem;
    }
    .btn {
      font-family: var(--sans);
      font-weight: 650;
      font-size: 0.95rem;
      border-radius: 0.35rem;
      padding: 0.65rem 1rem;
      cursor: pointer;
      border: 1px solid #1a1916;
      background: #fbf9f4;
      color: #1a1916;
    }
    .btn:hover:not(:disabled),
    .btn:focus-visible:not(:disabled) {
      background: #ffffff;
      color: #1a1916;
    }
    .btn.btn-run,
    .btn.btn-run:link,
    .btn.btn-run:visited {
      background: #1a1916;
      color: #fbf9f4;
      border-color: #1a1916;
    }
    .btn.btn-run:hover:not(:disabled),
    .btn.btn-run:focus-visible:not(:disabled) {
      background: #2a2824;
      color: #ffffff;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      font-family: var(--sans);
      font-size: 0.88rem;
      color: var(--muted);
      min-height: 1.2em;
    }
    .results {
      margin: 0.5rem 0 0;
      background: #14120e;
      color: #f4f1ea;
      padding: 1rem 1.05rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.84rem;
      line-height: 1.5;
      white-space: pre-wrap;
      min-height: 7rem;
      overflow: auto;
    }
    .results.is-empty { color: #9a958c; }
    .nav-row {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      margin: 1.35rem 0 0;
      padding-top: 1.1rem;
      border-top: 1px solid var(--line);
    }
    .honesty {
      margin-top: 1rem;
      font-family: var(--sans);
      font-size: 0.85rem;
      color: var(--muted);
    }
    .finish {
      margin-top: 1rem;
      padding: 1rem;
      border: 1px solid var(--line);
      background: var(--paper);
      font-size: 1.02rem;
    }
    .finish a { color: var(--accent); font-weight: 650; }
  </style>
</head>
<body>
  <header class="nav">
    <a class="wordmark" href="/">FractiSI</a>
    <nav class="nav-links" aria-label="Primary">
      <a href="/product/">Product</a>
      <a href="/test-drive/">Test Drive</a>
      <a href="/test-drive/self-paced/">Self-paced</a>
      <a href="/talks/aai-symposium-2026/">Talk</a>
      <a class="button" href="https://github.com/FractiAI/FractiSI-Multi-Agent">Repo</a>
    </nav>
  </header>

  <main class="walk" id="walk">
    <p class="progress" id="progress">Step …</p>
    <h1 id="title">Loading…</h1>
    <p class="component" id="component"></p>
    <div class="body" id="body"></div>

    <div class="actions">
      <button type="button" class="btn btn-run" id="btn-run">Run this lab</button>
      <span class="status" id="status"></span>
    </div>
    <pre class="results is-empty" id="results" hidden>Results appear here after you run the lab.</pre>
    <p class="honesty" id="honesty"></p>
    <div class="finish" id="finish" hidden>
      You finished the walkthrough. Try it on your machine (Community is free) or see editions.
      <br><a href="https://github.com/FractiAI/FractiSI-Multi-Agent">GitHub repo</a>
      · <a href="/product/pricing/">Pricing</a>
    </div>

    <div class="nav-row">
      <button type="button" class="btn" id="btn-prev">← Previous</button>
      <button type="button" class="btn" id="btn-next">Next →</button>
    </div>
  </main>

  <footer class="site-footer">
    <span>FractiSI · Self-paced Test Drive</span>
    <span><a href="/test-drive/">Test Drive hub</a></span>
  </footer>

  <script type="module">
    /**
     * Cold first-listen copy lives here so the walkthrough works even if the API is slow.
     * Live Run still hits /api/testdrive for measured lab output.
     */
    const STEPS = [
      {
        id: 'primer',
        n: 0,
        title: 'How FractiSI Multi-Agent fits together',
        component: 'Architecture primer · first listen',
        runLabel: 'Show the ladder',
        bodyHtml: `
          <p>You are about to walk a multi-agent stack built so many helpers — software agents and people — can work in one shared world instead of each keeping a full private copy.</p>
          <p>Read the ladder once in plain English, then press <strong>Show the ladder</strong> for the same map as live text. After that, use <strong>Next</strong> for the labs.</p>
          <p class="label">The ladder</p>
          <ul>
            <li><strong>Generative possibility</strong> — an open field of processes and patterns you can file, nest, and reuse (not infinite computers; not a second brand).</li>
            <li><strong>Net Zero (octave 0)</strong> — home base where the shared world roots.</li>
            <li><strong>Φ<sub>EGS</sub> ≈ 1.618</strong> — a nesting scale so layers stay tidy as they deepen (design grammar, not physics or mind).</li>
            <li><strong>Infinite Octaves</strong> — how deep the nesting goes; “infinite” means filing depth, not infinite measured physics.</li>
            <li><strong>Boundary nodes</strong> — the front door: what may enter the shared world.</li>
            <li><strong>Recursive trees · holographic rhyme</strong> — nested context that repeats and self-corrects across scale; a text prefix alone is not a rhyme.</li>
            <li><strong>3D Hexagon / eight-node · honeycomb</strong> — one story, eight connection ports so helpers plug in without reprinting the whole world.</li>
            <li><strong>Wave–Node–Fq · nested vectors · interference</strong> — which template is active, what each agent holds, and when paths would collide.</li>
            <li><strong>Awareness</strong> — what each participant (human or software) is holding about the shared world — not a claim of machine consciousness.</li>
            <li><strong>Product</strong> — Rhyming Templates → Tiny Gateway™ → Tiny Footprint (Layer A) → Layers B–F → FractiSI Multi-Agent.</li>
          </ul>
          <p>Possible rhyme with Active Inference: many agents — including humans — act in one shared world without each reprinting a private full copy. “Rhyme” means kinship for experiments, not “we are that framework.”</p>
        `,
      },
      {
        id: '1',
        n: 1,
        title: 'Share the world once',
        component: 'Layer A · Tiny Footprint',
        runLabel: 'Run this lab',
        bodyHtml: `
          <p class="label">Problem</p>
          <p>Without Layer A, every agent reprints a full copy of the shared world — like every coworker photocopying the whole project folder for themselves.</p>
          <p class="label">Opportunity</p>
          <p>Tiny Footprint registers the world once. Each agent keeps only its local deltas. Run the lab to see the byte contrast.</p>
        `,
      },
      {
        id: '2',
        n: 2,
        title: 'Gzip helps — architecture still matters',
        component: 'Layer A · Tiny Footprint pack',
        runLabel: 'Run this lab',
        bodyHtml: `
          <p class="label">Problem</p>
          <p>Compression shrinks copies. It does not remove the “N people each keep a full copy” structure.</p>
          <p class="label">Opportunity</p>
          <p>Share the world first. Then compression is optional polish. Run the lab for the residual after gzip.</p>
        `,
      },
      {
        id: '3',
        n: 3,
        title: 'Rhyme when the words differ',
        component: 'Tiny Gateway™ · Rhyming Templates',
        runLabel: 'Run this lab',
        bodyHtml: `
          <p class="label">Problem</p>
          <p>Exact-text and prefix caches only help when the wording matches. Real teams rephrase the same job all day.</p>
          <p class="label">Opportunity</p>
          <p>Rhyming Templates share organization across Infinite Octaves when the words change. Run the lab to compare rhyme vs exact cache.</p>
        `,
      },
      {
        id: '4',
        n: 4,
        title: 'Find what flat skim misses',
        component: 'Selective reconstruction · discovery',
        runLabel: 'Run this lab',
        bodyHtml: `
          <p class="label">Problem</p>
          <p>Under a fixed budget, flat skim never assembles multi-hop chains buried in noise.</p>
          <p class="label">Opportunity</p>
          <p>Selective reconstruction follows relationship edges across the shared world. Run the lab for the discovery score.</p>
        `,
      },
      {
        id: '5',
        n: 5,
        title: 'Converge with fewer rounds',
        component: 'Selective reconstruction · convergence',
        runLabel: 'Run this lab',
        bodyHtml: `
          <p class="label">Problem</p>
          <p>Collectives burn too many ops and rounds before a composed answer.</p>
          <p class="label">Opportunity</p>
          <p>The same guided path converges with fewer rounds and ops. Run the lab for the meters.</p>
        `,
      },
      {
        id: '6',
        n: 6,
        title: 'Coordinate before you merge',
        component: 'Layers B–D · coordination · shared state · composition',
        runLabel: 'Run this lab',
        bodyHtml: `
          <p class="label">Problem</p>
          <p>Parallel agents collide at merge when isolation meets a blind integrate.</p>
          <p class="label">Opportunity</p>
          <p>Layers B–D coordinate ownership and compose contributions before ship. Run the lab for the coordination contrast.</p>
        `,
      },
      {
        id: '7',
        n: 7,
        title: 'Density, Git, and paid deploy',
        component: 'Layer A density · E Git · F Deploy',
        runLabel: 'Run this lab',
        bodyHtml: `
          <p class="label">Problem</p>
          <p>Duplicated context burns the budget before specialized agent work begins.</p>
          <p class="label">Opportunity</p>
          <p>Tiny Footprint density fits more agents in the same representation budget. Git awareness (Layer E) is free on Community. Cloud deploy (Layer F) unlocks as paid Team · Enterprise · Cloud.</p>
        `,
      },
    ];

    const ORDER = STEPS.map((s) => s.id);
    let index = 0;
    let running = false;

    const progressEl = document.getElementById('progress');
    const titleEl = document.getElementById('title');
    const componentEl = document.getElementById('component');
    const bodyEl = document.getElementById('body');
    const btnRun = document.getElementById('btn-run');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');
    const honestyEl = document.getElementById('honesty');
    const finishEl = document.getElementById('finish');

    function current() {
      return STEPS[index];
    }

    function show(id) {
      const i = ORDER.indexOf(id);
      index = i >= 0 ? i : 0;
      const s = current();
      const total = STEPS.length;
      const label = s.n === 0 ? 'Primer' : 'Lab ' + s.n;
      progressEl.textContent = label + ' · ' + (index + 1) + ' of ' + total;
      titleEl.textContent = s.title;
      componentEl.textContent = s.component;
      bodyEl.innerHTML = s.bodyHtml;
      btnRun.textContent = s.runLabel || 'Run this lab';
      btnPrev.disabled = index === 0;
      btnNext.textContent = index >= STEPS.length - 1 ? 'Finish' : 'Next →';
      resultsEl.hidden = true;
      resultsEl.classList.add('is-empty');
      resultsEl.textContent = 'Results appear here after you run the lab.';
      statusEl.textContent = '';
      honestyEl.textContent = '';
      finishEl.hidden = true;
      history.replaceState(null, '', '#' + s.id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function runLab() {
      if (running) return;
      running = true;
      btnRun.disabled = true;
      statusEl.textContent = 'Running…';
      resultsEl.hidden = false;
      resultsEl.classList.remove('is-empty');
      resultsEl.textContent = '▸ measuring…';
      try {
        const id = current().id;
        const res = await fetch('/api/testdrive?step=' + encodeURIComponent(id), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ step: id }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.detail || data.error || ('HTTP ' + res.status));
        const step = data.step;
        const header = [
          step.title,
          'Layer: ' + step.layer,
          'Component: ' + step.component,
          'Ran in ' + data.ms + ' ms',
          '',
        ];
        resultsEl.textContent = header.concat(step.lines || []).join('\n');
        honestyEl.textContent = step.honesty || '';
        statusEl.textContent = 'Done · ' + data.ms + ' ms';
      } catch (err) {
        resultsEl.textContent = 'Could not run this lab.\n' + String(err.message || err);
        statusEl.textContent = 'Error — you can still use Next / Previous';
      } finally {
        running = false;
        btnRun.disabled = false;
      }
    }

    btnRun.addEventListener('click', runLab);
    btnPrev.addEventListener('click', () => {
      if (index > 0) show(ORDER[index - 1]);
    });
    btnNext.addEventListener('click', () => {
      if (index >= STEPS.length - 1) {
        finishEl.hidden = false;
        finishEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        return;
      }
      show(ORDER[index + 1]);
    });

    const hash = (location.hash || '').replace(/^#/, '');
    show(ORDER.includes(hash) ? hash : 'primer');
  </script>
</body>
</html>
