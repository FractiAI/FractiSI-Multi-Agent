# Deploy https://fractisi.vercel.app from this repo (marketing site at repo root).
# Secrets (FractiAI): VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID → FractiSI Vercel project.

name: Deploy FractiSI site to Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'media/**'
      - 'product/**'
      - 'company/**'
      - 'recruit/**'
      - 'research/**'
      - 'library/**'
      - 'open/**'
      - 'docs/web/**'
      - 'vercel.json'
      - '.github/workflows/vercel-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Missing VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID — skipping deploy."
            exit 0
          fi
          npx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
