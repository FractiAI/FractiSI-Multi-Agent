# Optional CLI deploy for https://fractisi.vercel.app.
# Hobby / default path: Vercel Git Integration on this repo (already production).
# This workflow only runs a second CLI deploy when VERCEL_* secrets are set.
# Missing secrets → soft-skip (exit 0) so main stays green on Hobby.

name: Deploy FractiSI site to Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'media/**'
      - 'product/**'
      - 'company/**'
      - 'recruit/**'
      - 'research/**'
      - 'library/**'
      - 'blog/**'
      - 'talks/**'
      - 'test-drive/**'
      - 'open/**'
      - 'docs/web/**'
      - 'content/**'
      - 'scripts/build-site.mjs'
      - 'vercel.json'
      - '.vercelignore'
      - '.github/workflows/vercel-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy production (or soft-skip on Hobby)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Hobby path: VERCEL_* secrets not set — skipping CLI deploy."
            echo "Production uses Vercel Git Integration for this repo (fractisi.vercel.app)."
            echo "To enable this workflow later: set VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID."
            exit 0
          fi
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
