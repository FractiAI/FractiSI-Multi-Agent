name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check
        run: |
          git ls-files '*.mjs' | while read -r file; do
            node --check "$file" || exit 1
          done
      - name: Paper copies stay in sync
        run: |
          cmp research/synthobs-tiny-gateway-rhyming-templates/paper/SYNTHOBS_TINY_GATEWAY_RHYMING_TEMPLATES_EGS_2026-11.md research/synthobs-tiny-gateway-rhyming-templates/docs/SYNTHOBS_TINY_GATEWAY_RHYMING_TEMPLATES_EGS_2026-11.md
      - name: Tests and repository gates
        run: npm test
      - name: Multi-session demo
        run: node scripts/tiny.mjs demo
      - name: Deterministic receipts reproduce
        run: |
          node scripts/run_deterministic_benchmarks.mjs
          git diff --exit-code output/data/deterministic/results.json

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install without PyTorch; LLM tests skip and say so
        run: uv sync --group dev --group figures
      - name: Lint
        run: uv run ruff check src/tiny_footprint_labs tests/tiny_footprint_labs tests/integration scripts
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest
