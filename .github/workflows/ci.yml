name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check
        run: |
          git ls-files '*.mjs' | while read -r file; do
            node --check "$file" || exit 1
          done
      - name: Paper copies stay in sync
        run: |
          cmp docs/TECH_PAPER.md research/synthobs-tiny-gateway-rhyming-templates/paper/SYNTHOBS_TINY_GATEWAY_RHYMING_TEMPLATES_EGS_2026-11.md
          cmp docs/TECH_PAPER.md research/synthobs-tiny-gateway-rhyming-templates/docs/SYNTHOBS_TINY_GATEWAY_RHYMING_TEMPLATES_EGS_2026-11.md
      - name: Unit tests
        run: npm test
      - name: Multi-session demo
        run: node scripts/tiny.mjs demo
